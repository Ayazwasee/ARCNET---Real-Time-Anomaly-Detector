services:
  neo4j:
    image: neo4j:5.26-community
    container_name: arcnet-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/arcnetpassword
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  arcnet-api:
    build: .
    container_name: arcnet-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=arcnetpassword
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
